name: mjumbe
description: "Mjumbe - Application d'actualités full-stack avec mode hors-ligne et Clean Architecture"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Architecture, State Management & Routing
  flutter_bloc: ^8.1.3
  go_router: ^13.2.0
  equatable: ^2.0.5

  # Network & Firebase Auth
  dio: ^5.4.1
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  internet_connection_checker: ^1.0.0+1

  # Storage & Offline Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # UI Components
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mocktail: ^1.0.3

flutter:
  uses-material-design: true